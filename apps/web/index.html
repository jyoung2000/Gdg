<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Meridian — one interface for every model, provider and modality." />
    <title>Meridian</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%232f6ae8' stroke-width='2.5'/%3E%3Cpath d='M16 3v26M3 16h26' stroke='%232f6ae8' stroke-width='1.5' opacity='.5'/%3E%3C/svg%3E" />
    <script>
      // Apply the stored theme before first paint. Without this the app flashes
      // the system theme for a frame before React mounts.
      (function () {
        try {
          var t = localStorage.getItem('meridian.theme');
          if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
          if (localStorage.getItem('meridian.reduceMotion') === 'true') {
            document.documentElement.setAttribute('data-reduce-motion', 'true');
          }
        } catch (e) {
          /* private mode: fall back to the system theme */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
