name: Windows desktop

# The only job that can answer whether Meridian installs and runs on Windows.
#
# Everything else in this repository runs on Linux and proves things about the
# code. This proves things about the product a person downloads: that the
# installer builds, that the payload boots on its own bundled runtime with no
# Node and no pnpm on the machine, that the database is created, and that it
# stops when asked.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'scripts/fetch-node-runtime.mjs'
      - 'scripts/package-desktop.mjs'
      - 'scripts/verify-desktop-payload.mjs'
      - '.github/workflows/windows-desktop.yml'
  workflow_dispatch:

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify the Windows installer
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Read the pinned runtime
        id: runtime
        shell: bash
        run: echo "version=$(node -p "require('./apps/desktop/runtime.json').version")" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      # This exact version, not "22.x". `better-sqlite3` is a native addon and
      # the prebuild fetched here decides its ABI; the bundled runtime must be
      # the same major or it fails at require() on a user's machine with an
      # error most people would read as a corrupt install.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.runtime.outputs.version }}
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Confirm the native addon was built for this runtime
        shell: pwsh
        run: |
          $binary = "node_modules/better-sqlite3/build/Release/better_sqlite3.node"
          if (-not (Test-Path $binary)) {
            Write-Error "better-sqlite3 has no compiled binary. The desktop payload cannot work without it."
            exit 1
          }
          # Loading it is the check. A file of the right name built for the
          # wrong ABI passes every check but this one.
          node -e "require('better-sqlite3'); console.log('better-sqlite3 loads under Node ' + process.versions.node + ' (ABI ' + process.versions.modules + ')')"

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        # The Linux suites run in the CI workflow; these are the ones whose
        # answers can differ on Windows — paths, shells, process lifecycle.
        run: |
          pnpm exec tsx --test tests/unit/platform-paths.test.ts
          pnpm exec tsx --test tests/unit/windows-runtime.test.ts
          pnpm exec tsx --test tests/e2e/desktop-lifecycle.test.ts

      - name: Build the gateway, CLI and web client
        run: pnpm build

      - name: Fetch and verify the bundled Node runtime
        run: node scripts/fetch-node-runtime.mjs --platform win32 --arch x64

      - name: Assemble the payload
        run: node scripts/package-desktop.mjs --platform win32 --arch x64

      # The check that matters. It boots the payload with its own runtime, from
      # a directory outside the checkout, creates a database through the native
      # addon, serves the web client, and stops on request.
      - name: Boot the payload on Windows
        run: node scripts/verify-desktop-payload.mjs

      - name: Rust tests
        working-directory: apps/desktop/src-tauri
        run: cargo test --release

      - name: Build the installer
        # Signing is configured through the environment and is absent on a fork
        # or an unsigned build; the installer is produced either way and the
        # release job is what refuses to publish an unsigned one.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm exec tauri build --config apps/desktop/src-tauri/tauri.conf.json

      - name: Find what was built
        id: artifacts
        shell: pwsh
        run: |
          $nsis = Get-ChildItem -Path apps/desktop/src-tauri/target/release/bundle/nsis -Filter *.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $nsis) {
            Write-Error "No installer was produced."
            exit 1
          }
          "installer=$($nsis.FullName)" >> $env:GITHUB_OUTPUT
          "installerName=$($nsis.Name)" >> $env:GITHUB_OUTPUT
          Write-Host "installer: $($nsis.Name) ($([math]::Round($nsis.Length / 1MB, 1)) MB)"

      # A silent install, then the checks a first-time user's machine would
      # answer. NSIS in currentUser mode needs no elevation, which is the whole
      # reason that mode was chosen.
      - name: Install it, the way a user would
        shell: pwsh
        run: |
          $installer = "${{ steps.artifacts.outputs.installer }}"
          Write-Host "Installing $installer"
          Start-Process -FilePath $installer -ArgumentList '/S' -Wait -NoNewWindow
          $root = Join-Path $env:LOCALAPPDATA 'Meridian'
          $exe = Join-Path $root 'Meridian.exe'
          if (-not (Test-Path $exe)) {
            # currentUser mode may also land under Programs; look before failing.
            $found = Get-ChildItem -Path $env:LOCALAPPDATA, $env:ProgramFiles -Filter 'Meridian.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $found) { Write-Error "Meridian.exe was not installed anywhere findable."; exit 1 }
            $exe = $found.FullName
            $root = Split-Path $exe
          }
          "installRoot=$root" >> $env:GITHUB_ENV
          "installExe=$exe" >> $env:GITHUB_ENV
          Write-Host "installed to $root"

      - name: Check the installation carries everything it needs
        shell: pwsh
        run: |
          $root = $env:installRoot
          foreach ($rel in @('runtime\node.exe', 'server\gateway\main.js', 'server\web\index.html', 'server\database\migrations')) {
            $p = Join-Path $root $rel
            if (-not (Test-Path $p)) { Write-Error "missing from the installation: $rel"; exit 1 }
            Write-Host "  ok  $rel"
          }
          # The installed runtime must be the pinned one, not whatever is on PATH.
          $v = & (Join-Path $root 'runtime\node.exe') --version
          Write-Host "bundled runtime reports $v"
          if ($v.TrimStart('v') -ne '${{ steps.runtime.outputs.version }}') {
            Write-Error "the installed runtime is $v, not the pinned ${{ steps.runtime.outputs.version }}"
            exit 1
          }

      # Start the installed application, and prove the gateway it owns actually
      # serves. The window needs a desktop session, which this runner has.
      - name: Launch the installed application and wait for its gateway
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath $env:installExe -PassThru
          Write-Host "launched pid $($proc.Id)"
          $state = Join-Path $env:LOCALAPPDATA 'Meridian\runtime\instance.json'
          $found = $false
          for ($i = 0; $i -lt 120; $i++) {
            if (Test-Path $state) { $found = $true; break }
            Start-Sleep -Seconds 1
          }
          if (-not $found) {
            Write-Host "--- shell log ---"
            Get-Content (Join-Path $env:LOCALAPPDATA 'Meridian\logs\meridian.log') -ErrorAction SilentlyContinue -Tail 80
            Write-Error "The application never started its gateway."
            exit 1
          }
          $info = Get-Content $state | ConvertFrom-Json
          Write-Host "gateway on port $($info.port), pid $($info.pid)"

          $health = Invoke-WebRequest -Uri "$($info.url)/api/system/health" -UseBasicParsing -TimeoutSec 20
          if ($health.StatusCode -ne 200) { Write-Error "health returned $($health.StatusCode)"; exit 1 }
          Write-Host "health: 200"

          $ui = Invoke-WebRequest -Uri "$($info.url)/" -UseBasicParsing -TimeoutSec 20
          if ($ui.Content -notmatch 'id="root"') { Write-Error "the web client was not served"; exit 1 }
          Write-Host "web client: served"

          # The database exists and was created by the bundled native addon.
          $db = Join-Path $env:APPDATA 'Meridian\meridian.db'
          if (-not (Test-Path $db)) { Write-Error "no database at $db"; exit 1 }
          Write-Host "database: $([math]::Round((Get-Item $db).Length / 1KB)) KB at $db"

          # The credential key is beside the database, not inside it.
          $key = Join-Path $env:APPDATA 'Meridian\master.key'
          if (-not (Test-Path $key)) { Write-Error "no master key at $key"; exit 1 }
          Write-Host "master key: present, DPAPI-wrapped"

          "gatewayPid=$($info.pid)" >> $env:GITHUB_ENV
          "shellPid=$($proc.Id)" >> $env:GITHUB_ENV

      - name: Quitting the application stops its gateway
        shell: pwsh
        run: |
          Stop-Process -Id $env:shellPid -Force -ErrorAction SilentlyContinue
          $gone = $false
          for ($i = 0; $i -lt 30; $i++) {
            if (-not (Get-Process -Id $env:gatewayPid -ErrorAction SilentlyContinue)) { $gone = $true; break }
            Start-Sleep -Seconds 1
          }
          if (-not $gone) {
            Write-Error "The gateway outlived the application. An orphan holding the port and the database is a process the user cannot find to stop."
            exit 1
          }
          Write-Host "no orphan: the gateway exited with its shell"

      - name: Reinstalling keeps the user's data
        shell: pwsh
        run: |
          $db = Join-Path $env:APPDATA 'Meridian\meridian.db'
          $before = (Get-FileHash $db).Hash
          Start-Process -FilePath "${{ steps.artifacts.outputs.installer }}" -ArgumentList '/S' -Wait -NoNewWindow
          if (-not (Test-Path $db)) { Write-Error "an upgrade destroyed the user's database"; exit 1 }
          $after = (Get-FileHash $db).Hash
          if ($before -ne $after) { Write-Error "an upgrade modified the user's database"; exit 1 }
          Write-Host "upgrade preserved the database unchanged"

      - name: Uninstalling removes the program and keeps the data
        shell: pwsh
        run: |
          $db = Join-Path $env:APPDATA 'Meridian\meridian.db'
          $uninstaller = Get-ChildItem -Path $env:installRoot -Filter 'uninstall*.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $uninstaller) {
            Write-Warning "No uninstaller was found at $env:installRoot; skipping the uninstall check and reporting it as unverified."
            exit 0
          }
          Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -Wait -NoNewWindow
          Start-Sleep -Seconds 5
          if (Test-Path $env:installExe) { Write-Error "the uninstaller left the program behind"; exit 1 }
          if (-not (Test-Path $db)) {
            Write-Error "the uninstaller deleted the user's data. Removing a program must not remove what a person made with it."
            exit 1
          }
          Write-Host "uninstall removed the program and kept the data"

      - name: Checksums
        shell: pwsh
        run: |
          $dir = Split-Path "${{ steps.artifacts.outputs.installer }}"
          Get-ChildItem -Path $dir -Filter *.exe | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)" | Out-File -FilePath (Join-Path $dir 'SHA256SUMS.txt') -Append -Encoding utf8
            Write-Host "$h  $($_.Name)"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: meridian-windows-x64
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error

      - name: Logs, whatever happened
        if: always()
        shell: pwsh
        run: |
          $log = Join-Path $env:LOCALAPPDATA 'Meridian\logs\meridian.log'
          if (Test-Path $log) {
            Write-Host "--- meridian.log ---"
            Get-Content $log -Tail 120
          }

  release:
    name: Publish
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: meridian-windows-x64
          path: dist

      - name: Attach the installer to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          body: |
            Windows x64 installer, built and verified on a Windows runner: the payload boots on its bundled Node,
            creates its database, serves the web client, stops with its shell, survives a reinstall, and keeps user
            data through an uninstall.

            Verify your download against `SHA256SUMS.txt` before running it.
